[project]
name = "inkmoth"
version = "0.2.0"
description = "Deep research agent with quote-level evidence validation, for any OpenAI-compatible model"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "strands-agents[openai]>=1.56,<2",
  "httpx>=0.27",
  "httpcore[asyncio]>=1.0.9,<2",
  "trafilatura>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "snowballstemmer>=2.2,<4",
  "pypdf>=6,<7",
]

[project.scripts]
inkmoth = "inkmoth.cli:app"

[project.urls]
Homepage = "https://github.com/jacobtownsend1/inkmoth"
Issues = "https://github.com/jacobtownsend1/inkmoth/issues"

[project.optional-dependencies]
mcp = [
    "mcp>=1.20,<2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkmoth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits the real LLM and SearXNG (deselected by default)"]
addopts = "-m 'not live'"
